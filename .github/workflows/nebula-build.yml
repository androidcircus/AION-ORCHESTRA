name: AION NEBULA - Multi-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Update Version Manifest
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p public
        echo "{\"version\": \"4.2.${{ github.run_number }}\", \"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"channel\": \"nebula-alpha\"}" > public/version.json
    - name: Build AION Core
      run: pnpm build
    - name: Sync Android
      working-directory: artifacts/aion-orchestra
      run: |
        if [ ! -d "android" ]; then npx cap add android; fi
        npx cap sync android
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
    - name: Build APK
      working-directory: artifacts/aion-orchestra/android
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-Nebula-APK
        path: artifacts/aion-orchestra/android/app/build/outputs/apk/debug/app-debug.apk

  build-pc:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Update Version Manifest
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p public
        echo "{\"version\": \"4.2.${{ github.run_number }}\", \"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"channel\": \"nebula-alpha\"}" > public/version.json
    - name: Build AION Core
      run: pnpm build
    - name: Sync Electron
      working-directory: artifacts/aion-orchestra
      run: |
        if [ ! -d "electron" ]; then npx cap add electron; fi
        npx cap sync electron
    - name: Build EXE
      working-directory: artifacts/aion-orchestra/electron
      run: |
        npm install
        npm run electron:make || echo "Electron make failed or script missing - check configuration"
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-Win-EXE
        path: artifacts/aion-orchestra/electron/out/make/**/*.exe

  build-apple:
    name: Build iOS & Mac (Prep)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Update Version Manifest
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p public
        echo "{\"version\": \"4.2.${{ github.run_number }}\", \"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"channel\": \"nebula-alpha\"}" > public/version.json
    - name: Build AION Core
      run: pnpm build
    - name: Sync iOS
      working-directory: artifacts/aion-orchestra
      run: |
        if [ ! -d "ios" ]; then npx cap add ios; fi
        npx cap sync ios
    - name: Build iOS App
      working-directory: artifacts/aion-orchestra/ios/App
      run: |
        # Skip actual xcode build if not in a proper macOS runner with certs, 
        # but let's try to at least verify the project structure
        xcodebuild -workspace App.xcworkspace -list || echo "iOS Project not ready"
    - name: Upload iOS Assets
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-iOS-Source
        path: artifacts/aion-orchestra/ios

  release:
    name: Create GitHub Release
    needs: [build-android, build-pc, build-apple]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nebula-latest
        name: AION Orchestra - Nebula Alpha (Latest)
        body: |
          Automated multi-platform build from Nebula Core.
          
          **Core Version:** 4.2.${{ github.run_number }}
          **Sync Status:** Logic Nodes Synchronized.
        draft: false
        prerelease: true
        files: |
          release-assets/**/*.apk
          release-assets/**/*.exe
          release-assets/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
