name: AION NEBULA - Multi-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Build AION Core
      run: |
        npx tsx scripts/cmo-swarm-heal.ts
        pnpm build
    - name: Update Version Manifest
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p public
        echo "{\"version\": \"4.2.${{ github.run_number }}\", \"buildDate\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"channel\": \"nebula-alpha\"}" > public/version.json
    - name: Sync Android
      working-directory: artifacts/aion-orchestra
      run: |
        # Ensure build directory exists for Capacitor
        mkdir -p dist/public
        if [ ! -d "android" ]; then npx cap add android; fi
        npx cap sync android
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
    - name: Build APK
      working-directory: artifacts/aion-orchestra/android
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-Nebula-APK-v4.2.${{ github.run_number }}
        path: artifacts/aion-orchestra/android/app/build/outputs/apk/debug/app-debug.apk

  build-pc:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Build AION Core
      run: |
        npx tsx scripts/cmo-swarm-heal.ts
        pnpm build
    - name: Sync Electron
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p dist/public
        if [ ! -d "electron" ]; then npx cap add electron; fi
        npx cap sync electron
    - name: Build EXE
      working-directory: artifacts/aion-orchestra/electron
      run: |
        # Only run if directory exists (cap add electron success)
        if [ -d "." ]; then
          npm install
          npm run electron:make || echo "Electron make failed - continuing"
        fi
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-Win-EXE-v4.2.${{ github.run_number }}
        path: artifacts/aion-orchestra/electron/out/make/**/*.exe
      continue-on-error: true

  build-apple:
    name: Build iOS & Mac (Prep)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      run: npm install -g pnpm
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile
    - name: Build AION Core
      run: |
        npx tsx scripts/cmo-swarm-heal.ts
        pnpm build
    - name: Sync iOS
      working-directory: artifacts/aion-orchestra
      run: |
        mkdir -p dist/public
        if [ ! -d "ios" ]; then npx cap add ios; fi
        npx cap sync ios
    - name: Prepare Release Bundle
      working-directory: artifacts/aion-orchestra
      run: |
        zip -r ios-source.zip ios
    - name: Upload iOS Assets
      uses: actions/upload-artifact@v4
      with:
        name: AION-Orchestra-iOS-Source-v4.2.${{ github.run_number }}
        path: artifacts/aion-orchestra/ios-source.zip

  release:
    name: Create GitHub Release
    needs: [build-android, build-pc, build-apple]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nebula-latest
        name: AION Orchestra - Nebula Alpha (Latest)
        body: |
          Automated multi-platform build from Nebula Core.
          
          **Core Version:** 4.2.${{ github.run_number }}
          **Status:** Logic Nodes Health Verified.
          **Agent Oversight:** Chief Medical Officer Active.
        draft: false
        prerelease: true
        files: |
          release-assets/*.apk
          release-assets/*.exe
          release-assets/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
